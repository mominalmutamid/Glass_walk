<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3C5B6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Graphify</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Newsreader:ital,wght@1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<style>
:root{color-scheme:light;--bg:#F6F8F5;--card:#FFFFFF;--ink:#2B332E;--mut:#5A6A5F;--line:#DCE5DD;--deep:#52695A;--cam:#B3C5B6;--soft:#EDF2EE;--bad:#C27C5E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.bar{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:18px;color:var(--deep)}
.sp{flex:1}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg button{border:0;background:none;border-radius:7px;padding:0 16px;min-height:40px;font-size:14px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--cam);color:var(--ink);font-weight:600}
.th{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px}
.pri{display:flex;align-items:center;gap:8px;border:0;background:var(--deep);color:#FFFFFF;font-weight:600;font-size:14px;padding:0 16px;min-height:44px;border-radius:8px;cursor:pointer}
main{flex:1;display:flex;min-height:0}
aside{width:340px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;overflow-y:auto}
.lbl{font-size:13px;font-weight:600;color:var(--mut)}
#chips,#params{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:0 4px 0 12px;min-height:48px}
.chip:focus-within{border-color:var(--cam);background:var(--bg)}
.chip.bad{border-color:var(--bad)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.chip input{flex:1;min-width:0;border:0;background:none;font-size:16px;outline:0}
.chip button{border:0;background:none;cursor:pointer;color:var(--mut);min-width:44px;min-height:44px}
.add{border:1px dashed var(--cam);background:none;border-radius:10px;min-height:48px;font-size:14px;color:var(--mut);cursor:pointer}
#params:empty::before{content:"Sliders appear when you use a letter like a.";font-size:13px;color:var(--mut)}
.pm{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.pm input{accent-color:var(--deep);width:100%}
.pm b{color:var(--deep);min-width:34px;text-align:right}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:32px}
.chk input{width:18px;height:18px;accent-color:var(--deep)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.sec{border:1px solid var(--line);background:none;border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer;font-size:14px}
.mut{color:var(--mut);font-size:13px;min-height:16px}
.gz{flex:1;position:relative;background:var(--card);min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.zm{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.zm button{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:20px;color:var(--deep);cursor:pointer}
@media (max-width:760px){main{flex-direction:column}aside{width:auto;height:46%;border-right:0;border-top:1px solid var(--line);order:2}.th span{display:none}.bar{gap:8px}.sp{display:none}}
#kb{display:none;flex:none;flex-direction:column;gap:6px;background:var(--soft);border-top:1px solid var(--line);padding:8px;box-sizing:border-box;width:100%;max-width:640px;align-self:center}
#app.kbo #kb{display:flex}
.kr{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#kb button{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:17px;padding:0;cursor:pointer}
#kb button.k2{background:#E4ECE6;font-size:15px}
#kb button.dn{background:var(--deep);color:#FFFFFF;border-color:var(--deep);font-size:14px;font-weight:600}
@media (max-width:760px){#app.kbo aside{height:32%}}
.chip{flex-wrap:wrap;row-gap:0}
.sw{display:none;width:100%;gap:8px;padding:2px 12px 12px;flex-wrap:wrap}
.chip:focus-within .sw{display:flex}
.swb{width:36px;height:36px;border-radius:50%;border:2px solid #FFFFFF;box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer}
[hidden]{display:none!important}
.chip .cpk{flex:none;width:36px;height:36px;padding:0;border:2px solid #FFFFFF;box-shadow:0 0 0 1px var(--line);border-radius:50%;background:none;cursor:pointer}
.cpk::-webkit-color-swatch-wrapper{padding:0}
.cpk::-webkit-color-swatch{border:0;border-radius:50%}
.chip .hxi{flex:none;width:92px;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:14px;background:var(--card)}
#tbox{display:flex;flex-direction:column;gap:8px}
.tl{border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.tp{padding:0 0 8px}
.tp .pm{border:0;padding:4px 0}
.tp .row{padding:4px 0}
#tout{white-space:pre-line}
#svn{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:44px;font-size:16px;background:var(--card)}
#svl{display:flex;flex-direction:column;gap:4px}
#svl:empty::before{content:"No saved graphs yet.";font-size:13px;color:var(--mut)}
.sv{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:14px}
.sv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pv{display:flex;flex-direction:column;gap:6px}
#pv img{width:100%;display:block;border:1px solid var(--line);border-radius:10px}
.bar{padding:4px 10px;gap:10px;flex-wrap:nowrap}
.seg button{min-height:34px;padding:0 12px}
.pri{min-height:38px}
#ph{display:none}
.zm{flex-direction:row;right:10px;bottom:10px;gap:6px}
.zm button{width:36px;height:36px;font-size:16px;background:rgba(255,255,255,.88)}
@media (max-width:760px){
.bar{padding:4px 8px;gap:6px}
.brand{font-size:16px}
.seg{padding:3px}.seg button{min-height:34px;padding:0 10px;font-size:13px}
.pri{padding:0 12px}.et{display:none}
.sp{display:block;flex:1}
aside{height:38%;padding:8px 12px;gap:8px}
#ph{display:flex;align-items:center;justify-content:space-between;border:0;background:none;padding:0;min-height:32px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer;flex:none}
.chip{min-height:42px}
#app.pc aside{height:auto;overflow:hidden}
#app.pc aside>*:not(#ph){display:none}
#app.pc #kb{display:none}
}
.bt{display:flex;gap:6px}
.ic{min-width:44px;padding:0;font-size:18px}
button:disabled{opacity:.4;cursor:default}
label.sec{display:flex;align-items:center;justify-content:center}
#xj{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;background:var(--card);color:var(--ink)}
#pts{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px;background:var(--card);color:var(--ink)}
#dbox{display:flex;flex-direction:column;gap:8px}
#fout{white-space:pre-line}
#app.mm .xp{display:none}
#mbox{display:flex;flex-direction:column;gap:8px}
#mbox[hidden]{display:none}
#mg{display:grid;gap:6px}
#mvs{display:flex;flex-direction:column;gap:6px}
#mout{white-space:pre-line}
.mi{min-height:44px;font-size:16px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
#svl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#svl:empty::before{grid-column:1/-1}
.gc{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--card)}
.gc img{width:100%;aspect-ratio:11/7;object-fit:cover;background:var(--soft);display:block}
.gn{padding:6px 8px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb{display:flex;gap:6px;padding:0 8px 8px}
.gb .sec{flex:1;min-height:36px;padding:0 6px;font-size:13px}
#vpv{width:100%;border-radius:10px;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">
<header class="bar"><div class="brand">Graphify</div>
<div class="seg"><button data-m="plot" class="on">2D</button><button data-m="surf">3D</button><button data-m="art">Art</button><button data-m="mat">Matrix</button></div>
<div class="sp"></div>
<button class="pri" id="save" aria-label="Export PNG"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="et">Export PNG</span></button>
</header>
<main>
<aside>
<button id="ph" aria-expanded="true"><span id="pht">Hide panel</span><span id="pha" aria-hidden="true">▾</span></button>
<div class="row xp"><span class="lbl">Expressions</span><span class="bt"><button class="sec ic" id="undo" aria-label="Undo" disabled>↶</button><button class="sec ic" id="redo" aria-label="Redo" disabled>↷</button><button class="sec" id="kbt" aria-pressed="false">Keypad</button></span></div><div id="chips" class="xp"></div>
<div class="lbl xp">Parameters</div><div id="params" class="xp"></div>
<div id="tbox"><div class="lbl">Tools</div><label class="row">Apply to <select id="tf" aria-label="Curve for tools"></select></label><div class="mut" id="tout" role="status"></div><div id="tools"></div></div>
<div id="dbox"><div class="lbl">Data points and curve fitting</div>
<textarea id="pts" rows="4" placeholder="x, y  (one point per line)" aria-label="Data points"></textarea>
<label class="chk"><input type="checkbox" id="tapAdd"> Tap the graph to add points</label>
<label class="row">Fit <select id="fitm" aria-label="Fit type"><option value="none">No fit</option><option value="line">Line</option><option value="poly">Polynomial</option><option value="spl">Cubic spline</option></select></label>
<label class="pm" id="degr" hidden><span>degree</span><input type="range" id="fdeg" min="1" max="8" step="1" value="2" aria-label="Polynomial degree"><b id="fdv">2</b></label>
<div class="mut" id="fout" role="status"></div></div>
<div id="mbox" hidden><div class="lbl">Matrix transformation</div>
<label class="row">Size <select id="msz" aria-label="Matrix size"><option value="2">2 × 2</option><option value="3">3 × 3</option></select></label>
<div id="mg"></div>
<label class="row">Preset <select id="mpre" aria-label="Preset matrix"></select></label>
<label class="pm"><span>blend</span><input type="range" id="mt" min="0" max="1" step="0.01" value="1" aria-label="Blend from the identity to the matrix"><b id="mtv">1</b></label>
<div id="mvs"></div>
<div class="mut" id="mout" role="status"></div></div>
<div class="lbl">Export options</div>
<label class="row">Theme <select id="theme" aria-label="Theme"><option value="light">Cameo light</option><option value="stone">Stone</option></select></label>
<label class="chk"><input type="checkbox" id="kGrid" checked> Grid and axes</label>
<label class="chk"><input type="checkbox" id="kCap" checked> Equation caption</label>
<label class="row">Image size <select id="sz"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option></select></label>
<button class="sec" id="surp">Surprise me</button>
<label class="row">Video length <select id="vdur" aria-label="Video length"><option value="3">3 s</option><option value="6" selected>6 s</option><option value="10">10 s</option></select></label>
<button class="sec" id="vrec">Record video of the animation</button>
<video id="vpv" controls playsinline hidden></video>
<div class="mut" id="stat" role="status"></div>
<div id="pv" hidden><img id="pvi" alt="Exported graph preview"><div class="mut">Press and hold the picture to save it if the download did not start.</div></div>
<div class="lbl">Saved graphs</div>
<div class="row"><input id="svn" placeholder="Name this graph" maxlength="40" aria-label="Graph name"><button class="sec" id="svb">Save</button></div>
<div id="svl"></div>
<div class="row"><button class="sec" id="exj">Export file</button><label class="sec" for="imp">Import file</label><input type="file" id="imp" accept=".json,application/json" hidden></div>
<textarea id="xj" rows="4" readonly hidden aria-label="Exported graph data"></textarea>
</aside>
<section class="gz"><canvas id="cv" role="img" aria-label="Graph canvas. Drag to move, pinch or scroll to zoom."></canvas>
<div class="zm"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="anim" aria-label="Animate" aria-pressed="false">▶</button></div></section>
</main>
<div id="kb" role="group" aria-label="Math keypad"></div>
</div>
<script>
(function(){
const $=s=>document.querySelector(s);
const TH={
light:{bg:'#FFFFFF',grid:'#E6ECE7',axis:'#5A6A5F',ink:'#2B332E',c:['#52695A','#4F8A8B','#C27C5E','#6C85A6','#8A7F52'],lo:'#B3C5B6',hi:'#3F5A49',glow:0},
stone:{bg:'#B3C5B6',grid:'#A2B6A5',axis:'#2B332E',ink:'#1F2823',c:['#2B332E','#FFFFFF','#52695A','#F6F8F5','#3C4D41'],lo:'#E9F0EA',hi:'#2F4237',glow:0}};
const RES=new Set(['x','y','z','t','r','time']);
const S={mode:'plot',view:{cx:0,cy:0,s:44},rot:{a:-0.8,b:0.6},zoom:1,theme:'light',grid:true,glow:false,cap:true,scale:2,trace:null,data:{txt:'',fit:'none',deg:2},mat:{n:2,m2:[2,1,1,2],m3:[2,1,0,1,2,0,0,0,3],t:1,v:[1,1,1]},out:[],tool:{f:-1,f3:-1,od:false,ox:0,oy:1,oh:.5,on:10,nm:false,nmm:'bis',na:0,nb:2,nk:8,ie:false,ia:0,ib:3,tb:false,tbf:0,tbs:1,tbn:8,tp:false,ta:1,tb:1,vi:false,xa:-2,xb:2,ya:-2,yb:2,der:false,tan:false,tx:1,rie:false,ra:0,rb:3,rn:8,rm:'mid',tay:false,tn:3,tc:0,nw:false,nx:1,ns:4,ix:false},kbMode:(window.matchMedia&&matchMedia('(pointer: coarse)').matches)?'math':'native',params:{a:3,time:0},anim:false,
lists:{plot:[{e:'a*sin(x)'},{e:'x^2/4'},{e:'x^2+y^2=25'}],surf:[{e:'sin(sqrt(x^2+y^2))'}],art:[{e:'r=5*cos((3+sin(time/2))*t)'},{e:'r=3+2*sin(5*t+time)'},{e:'r=0.3*t*cos(2*t+time)'}],mat:[]}};
if(!window.math){$('#chips').textContent='The math library did not load. Check your connection and reload.';return}
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'};
function pw(s){return s.replace(/\{([^{}]*)\}/g,(m,b)=>{const parts=[];let d=0,cur='';for(const ch of b){if(ch==='('||ch==='[')d++;if(ch===')'||ch===']')d--;if(ch===','&&d===0){parts.push(cur);cur=''}else cur+=ch}parts.push(cur);let out='NaN';
for(let i=parts.length-1;i>=0;i--){const k=parts[i].indexOf(':');if(k<0)return m;out='(('+parts[i].slice(0,k)+')?('+parts[i].slice(k+1)+'):('+out+'))'}return out})}
const SUP={'²':'^2','³':'^3','⁴':'^4'};
function norm(s){return pw(s).replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/[²³⁴]/g,c=>SUP[c]).replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/θ/g,'t').replace(/√\s*\(/g,'sqrt(').replace(/√\s*([A-Za-z0-9.]+)/g,'sqrt($1)')}
function comp(it,mode){const raw=norm(it.e.trim());it.c=null;it.bad=false;if(!raw)return;
try{let s=raw,k='ex',ine=null,rg={};
const sm=s.indexOf(';');if(sm>0){s.slice(sm+1).replace(/([tuv])\s*=\s*([^,;]+?)\s*\.\.\s*([^,;]+)/g,(m,v,a,b)=>{rg[v]=[math.evaluate(a),math.evaluate(b)];return m});s=s.slice(0,sm).trim()}
const tp=tupleParts(s);
if(tp&&((mode!=='surf'&&tp.length===2)||(mode==='surf'&&tp.length===3))){const nodes=tp.map(x=>math.parse(x)),names=[];
nodes.forEach(nd=>nd.traverse((q,p,par)=>{if(q.isSymbolNode&&!(par&&par.isFunctionNode&&p==='fn')&&!RES.has(q.name)&&!(q.name in math)&&!['t','u','v'].includes(q.name))names.push(q.name)}));
const uses=nm=>nodes.some(nd=>{let f=false;nd.traverse(q=>{if(q.isSymbolNode&&q.name===nm)f=true});return f});
it.c={f:nodes[0].compile(),fs:nodes.map(nd=>nd.compile()),k:mode!=='surf'?'par':(uses('u')||uses('v')?'psf':'pc3'),names,n:nodes[0],rg};return}
if(mode!=='surf'){
const ig=(/^[yrz]\s*=/i.test(s)||s.includes('?'))?null:s.match(/^([^<>]*?)(<=|>=|<|>)([^<>]*)$/);
const od=s.match(/^(?:y'|y′|dy\/dx)\s*=\s*(.+)$/i);
if(od){k='ode';s=od[1]}else if(ig){ine=ig[2];s='('+ig[1]+')-('+ig[3]+')';k='imp'}else if(/^r\s*=/i.test(s)){k='pol';s=s.replace(/^r\s*=/i,'')}
else if(/^y\s*=/i.test(s))s=s.replace(/^y\s*=/i,'');
else if(s.indexOf('=')>0){const p=s.split('=');if(p.length!==2)throw 0;s='('+p[0]+')-('+p[1]+')';k='imp'}
}else if(/^z\s*=/i.test(s))s=s.replace(/^z\s*=/i,'');else if(s.indexOf('=')>0){const p=s.split('=');if(p.length!==2)throw 0;s='('+p[0]+')-('+p[1]+')';k='imp'}
const n=math.parse(s),names=[];
n.traverse((q,p,par)=>{if(q.isSymbolNode&&!(par&&par.isFunctionNode&&p==='fn')&&!RES.has(q.name)&&!(q.name in math))names.push(q.name)});
it.c={f:n.compile(),k,names,n,ine};
}catch(e){it.bad=true}}
function ev(c,sc){try{const v=c.f.evaluate(sc);return typeof v==='number'?v:NaN}catch(e){return NaN}}
const fmt=n=>String(+n.toFixed(6));
function plot(ctx,W,H,T,o){const v=S.view,s=v.s;
const gx=x=>W/2+(x-v.cx)*s,gy=y=>H/2-(y-v.cy)*s;
if(o.grid){const raw=70/s,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,st=p*(m>=5?5:m>=2?2:1);
const i0=Math.ceil((v.cx-W/2/s)/st),i1=Math.floor((v.cx+W/2/s)/st),j0=Math.ceil((v.cy-H/2/s)/st),j1=Math.floor((v.cy+H/2/s)/st);
ctx.lineWidth=1;ctx.strokeStyle=T.grid;ctx.beginPath();
for(let i=i0;i<=i1;i++){const X=gx(i*st);ctx.moveTo(X,0);ctx.lineTo(X,H)}
for(let j=j0;j<=j1;j++){const Y=gy(j*st);ctx.moveTo(0,Y);ctx.lineTo(W,Y)}
ctx.stroke();
ctx.strokeStyle=T.axis;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,gy(0));ctx.lineTo(W,gy(0));ctx.moveTo(gx(0),0);ctx.lineTo(gx(0),H);ctx.stroke();
ctx.fillStyle=T.axis;ctx.font='11px "DM Sans",sans-serif';
const ay=Math.min(Math.max(gy(0)+14,14),H-6),ax=Math.min(Math.max(gx(0)-6,28),W-4);
ctx.textAlign='center';for(let i=i0;i<=i1;i++)if(i)ctx.fillText(fmt(i*st),gx(i*st),ay);
ctx.textAlign='right';for(let j=j0;j<=j1;j++)if(j)ctx.fillText(fmt(j*st),ax,gy(j*st)+4)}
S.lists[S.mode].forEach((it,i)=>{if(!it.c)return;const c=it.c,sc=Object.assign({},S.params),col=colOf(it,i);
ctx.strokeStyle=col;ctx.lineWidth=2.6;ctx.shadowColor=col;ctx.shadowBlur=o.glow?14:0;ctx.beginPath();
if(c.k==='ex'){let pen=false,py=0;
for(let px=0;px<=W;px++){sc.x=v.cx+(px-W/2)/s;const y=ev(c,sc);if(!isFinite(y)){pen=false;continue}const Y=gy(y);
